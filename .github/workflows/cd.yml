# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CD

on:
  push:
    branches: [ "main" ]

# Build, test and image-scan only need to read the repo.
permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if docs-only change
        id: check
        # Pass context values via env (never interpolate into the script body)
        # to avoid shell/script injection.
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # For push events prefer the exact before..after range from GitHub.
          # Fallback to HEAD~1..HEAD for first-commit/force-push edge cases.
          BEFORE="$BEFORE_SHA"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "$BEFORE".."$AFTER_SHA" 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Check if any file is NOT docs-only.
          #
          # docs_only=true SKIPS the build, test and security jobs, so this
          # list decides what ships unscanned. It is deliberately extension-
          # driven, not directory-driven: `.*\.md$` already covers every
          # prose file under .claude/ (agents, docs, skills, hook-test
          # fixtures), while .claude/hooks/**, statusline.py, settings.json
          # and skill-router.json correctly fall through as code and get the
          # full pipeline. Do NOT add a bare `\.claude/` prefix here -- that
          # would let a change to hook code skip CodeQL, Semgrep, Trivy,
          # secret scanning and the tests.
          #
          # The bare `\.squad/` prefix that used to sit here had exactly that
          # defect: it classified ANY file under .squad/ as docs, including a
          # .sh or .yml. .squad/ holds only .md plus three .gitkeep files, so
          # `.*\.md$` and `(.*/)?\.gitkeep$` cover the real contents with no
          # behaviour change and no blanket directory exemption.
          #
          # `(.*/)?\.gitkeep$`, NOT `.*\.gitkeep$` (round 4 re-review,
          # review-b93b430.md, finding 3 nit): the looser form matches any
          # filename merely ENDING in the literal text ".gitkeep", so
          # e.g. `notreally.gitkeep` was silently treated as docs-only too.
          # `(.*/)?\.gitkeep$` requires the basename to be exactly
          # `.gitkeep`, matching the JS `isMaintenancePath` check in
          # pr-validation.yml (`/(^|\/)\.gitkeep$/`) and the identical shell
          # filter in codeql.yml -- kept in step across all three
          # deliberately.
          NON_DOCS=$(echo "$CHANGED" | grep -vE '^((.*/)?\.gitkeep$|docs/|\.github/instructions/|.*\.md$|LICENSE$)' | grep -v '^$' || true)

          if [ -z "$NON_DOCS" ] && [ -n "$CHANGED" ]; then
            echo "docs_only=true" >> $GITHUB_OUTPUT
            echo "✅ Docs-only change detected — skipping expensive jobs"
          else
            echo "docs_only=false" >> $GITHUB_OUTPUT
            echo "🔧 Code changes detected — running all jobs"
          fi

  build:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs_only == 'false'

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v6
      with:
          fetch-depth: 0

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Install WASM experimental workload
      run: dotnet workload install wasm-experimental wasm-tools
    # The solution includes Uno.Sdk projects (Picea.Abies.WinUI), whose SDK and
    # package graph are resolved on restore. Caching keeps that off the
    # critical path.
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
        restore-keys: |
          nuget-${{ runner.os }}-
    - name: Restore dependencies
      run: dotnet restore

    - name: Check for vulnerable packages (SCA)
      run: |
        echo "🔍 Scanning for vulnerable packages..."
        dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt

        # `dotnet list package` runs an implicit restore, and NuGetAuditMode=all
        # (Directory.Build.props) makes that restore emit NU1902/NU1903 warnings
        # whose text contains "high". Grepping the whole file therefore tripped
        # this gate on restore noise rather than on the report. Match only the
        # report's package rows, which are indented and start with ">".
        if grep -E '^[[:space:]]*>' vulnerability-report.txt | grep -qiE "critical|high"; then
          echo "❌ Critical or High severity vulnerabilities detected!"

          if [ -n "${ALLOW_TRANSITIVE_VULNS:-}" ]; then
            if echo "${ALLOW_TRANSITIVE_VULNS}" | grep -Eq '^https?://'; then
              echo "⚠️  Temporarily allowing vulnerabilities due to tracked issue:"
              echo "    ${ALLOW_TRANSITIVE_VULNS}"
              echo "Remove this exception as soon as remediations are available."
            else
              echo "❌ ALLOW_TRANSITIVE_VULNS is set but is not a valid http(s) URL:"
              echo "    ${ALLOW_TRANSITIVE_VULNS}"
              exit 1
            fi
          else
            echo "❌ Failing build because high/critical vulnerabilities were found."
            echo "To temporarily allow this, set ALLOW_TRANSITIVE_VULNS to a tracking issue URL."
            exit 1
          fi
        else
          echo "✅ No critical or high severity vulnerabilities found"
        fi

    - name: Build
      run: dotnet build --no-restore
    - name: Test Picea.Abies.Tests
      run: dotnet test --project Picea.Abies.Tests/Picea.Abies.Tests.csproj --no-build --verbosity normal
    - name: Test Picea.Abies.Server.Tests
      run: dotnet test --project Picea.Abies.Server.Tests/Picea.Abies.Server.Tests.csproj --no-build --verbosity normal
    - name: Test Picea.Abies.Server.Kestrel.Tests
      run: dotnet test --project Picea.Abies.Server.Kestrel.Tests/Picea.Abies.Server.Kestrel.Tests.csproj --no-build --verbosity normal
    - name: Test Picea.Abies.Conduit.Tests
      run: dotnet test --project Picea.Abies.Conduit.Tests/Picea.Abies.Conduit.Tests.csproj --no-build --verbosity normal
    - name: Test Picea.Abies.Conduit.Wasm.Tests
      run: dotnet test --project Picea.Abies.Conduit.Wasm.Tests/Picea.Abies.Conduit.Wasm.Tests.csproj --no-build --verbosity normal
    - name: Test Picea.Abies.Conduit.Api.Tests
      run: dotnet test --project Picea.Abies.Conduit.Api.Tests/Picea.Abies.Conduit.Api.Tests.csproj --no-build --verbosity normal
    - name: Test Picea.Abies.Analyzers.Tests
      run: dotnet test --project Picea.Abies.Analyzers.Tests/Picea.Abies.Analyzers.Tests.csproj --no-build --verbosity normal
    - name: Test Picea.Abies.Native.Tests
      run: dotnet test --project Picea.Abies.Native.Tests/Picea.Abies.Native.Tests.csproj --no-build --verbosity normal
    - name: Test Picea.Abies.Templates.Testing (build-smoke only)
      run: dotnet test --project Picea.Abies.Templates.Testing/Picea.Abies.Templates.Testing.csproj --no-build --verbosity normal -- --treenode-filter "/*/*/*/*[Category!=E2E]"

    - name: Build container images from Dockerfiles
      run: |
        mapfile -t dockerfiles < <(find . -name 'Dockerfile' -type f | sort)

        if [ "${#dockerfiles[@]}" -eq 0 ]; then
          echo "No Dockerfiles found. Skipping image build phase."
          exit 0
        fi

        : > /tmp/cd-image-tags.txt

        for dockerfile in "${dockerfiles[@]}"; do
          context_dir=$(dirname "$dockerfile")
          rel=${context_dir#./}
          tag="abies-$(echo "$rel" | tr '/._' '---' | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-'):ci"

          echo "Building image $tag from $dockerfile"
          docker build -f "$dockerfile" -t "$tag" .
          echo "$tag" >> /tmp/cd-image-tags.txt
        done

        echo "Built images:"
        cat /tmp/cd-image-tags.txt

    - name: Trivy image scan (HIGH/CRITICAL)
      run: |
        if [ ! -f /tmp/cd-image-tags.txt ]; then
          echo "No built image list found. Skipping image scanning."
          exit 0
        fi

        TRIVY_IMAGE=""
        for candidate in ghcr.io/aquasecurity/trivy:latest aquasec/trivy:latest; do
          if docker pull "$candidate" >/dev/null 2>&1; then
            TRIVY_IMAGE="$candidate"
            break
          fi
        done

        if [ -z "$TRIVY_IMAGE" ]; then
          echo "❌ Could not pull a usable Trivy image."
          exit 1
        fi

        echo "Using Trivy image: $TRIVY_IMAGE"

        while IFS= read -r image_tag; do
          [ -z "$image_tag" ] && continue
          echo "Scanning image: $image_tag"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$image_tag"
        done < /tmp/cd-image-tags.txt

    # PostgreSQL integration tests are skipped in CD — they require a
    # PostgreSQL service container that is not provisioned in this workflow.
    # Run locally with: CONDUIT_POSTGRES_CONNECTION="..." dotnet test --project ...
