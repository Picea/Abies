name: Claude Hooks Tests

# Regression + coverage suite for the squad's Claude Code hooks
# (.claude/hooks/**). Nothing else in .github/workflows/** exercised these
# scripts — .claude/hooks/tests/run.sh's own header comment assumes a
# paths:-scoped CI job exactly like this one exists; until this workflow,
# that assumption was false and the suite's 67+ assertions never ran
# automatically.
#
# Scoped to .claude/hooks/** (plus its own workflow file) so it doesn't run
# on every unrelated PR. No fetch-depth: 0 needed — see run.sh's header:
# the two pre-fix hook revisions it regression-tests are vendored as
# fixtures under fixtures-pre-fix/, not read via `git show <ref>`, so the
# default shallow checkout is sufficient.

on:
  pull_request:
    paths:
      - '.claude/hooks/**'
      # Everything below is a $REPO_ROOT-relative file the four suites
      # (run.sh, blindness.sh, phase-gates.sh, invariant-chain.sh) read
      # OUTSIDE .claude/hooks/**, verified by:
      #   grep -hoE '\$(REPO_ROOT|ROOT)/[A-Za-z0-9_./*-]+' .claude/hooks/tests/*.sh
      # minus every hit already under .claude/hooks/ (covered by the line
      # above). Round 1 review of PR #358, 🔴-1: this enumeration went
      # stale the moment a later suite started reading a new out-of-hooks
      # file and nobody updated it here -- a PR that ONLY touched, say,
      # .claude/settings.json (deleting every PreToolUse matcher, unwiring
      # every hook this workflow tests) would not trigger this workflow at
      # all and would merge green. The `path coverage:` assertion inside
      # blindness.sh re-derives this same grep at test time and fails loud
      # if it finds a path not listed here, so this list drifting again is
      # a five-second CI failure instead of a silent gap.
      - '.claude/agents/**'
      - '.claude/commands/**'
      - '.claude/docs/decision-schema.md'
      - '.claude/docs/memory-policy.md'
      - '.claude/docs/pattern-lexicon.md'
      - '.claude/docs/principles-enforcement.md'
      - '.claude/settings.json'
      - '.claude/skills/beast-mode-design/SKILL.md'
      - '.claude/statusline.py'
      - '.squad/.gate-shadow'
      - '.github/workflows/claude-hooks-tests.yml'
  push:
    branches: [ "main" ]
    paths:
      - '.claude/hooks/**'
      # See the matching comment under pull_request above.
      - '.claude/agents/**'
      - '.claude/commands/**'
      - '.claude/docs/decision-schema.md'
      - '.claude/docs/memory-policy.md'
      - '.claude/docs/pattern-lexicon.md'
      - '.claude/docs/principles-enforcement.md'
      - '.claude/settings.json'
      - '.claude/skills/beast-mode-design/SKILL.md'
      - '.claude/statusline.py'
      - '.squad/.gate-shadow'
      - '.github/workflows/claude-hooks-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-hooks-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-suite:
    name: Run hooks test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run .claude/hooks/tests/run.sh
        run: bash .claude/hooks/tests/run.sh
