name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Publishes to NuGet using a stored API key (not OIDC), so only read access
# to the repo is required. No id-token needed.
permissions:
  contents: read

jobs:
  # Picea.Abies.WinUI resolves net10.0-windows10.0.26100 only on Windows (the
  # TFM is guarded by IsOSPlatform). Packing it on Linux would silently ship a
  # package with the Uno Skia head alone and no Windows App SDK target, so it is
  # packed here and handed to the release job as an artifact.
  pack-winui:
    name: Pack Picea.Abies.WinUI (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install GitVersioning
        run: dotnet tool install --global nbgv

      # Must mirror the release job exactly. Passing /p:Version alone is not
      # enough: Nerdbank.GitVersioning overrides it and stamps a dev version, so
      # v2.3.0 produced Picea.Abies.WinUI 2.3.1-gbb31d7ec9b while every other
      # package was 2.3.0. `nbgv set-version` plus PublicRelease=true is what
      # makes the tag version stick and drops the -g<hash> suffix.
      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            nbgv set-version "$VERSION"
            echo "PublicRelease=true" >> "$GITHUB_ENV"
          else
            VERSION=$(nbgv get-version -v SimpleVersion)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Packing Picea.Abies.WinUI as $VERSION"

      - name: Pack Picea.Abies.WinUI (Skia + Windows App SDK heads)
        run: dotnet pack ./Picea.Abies.WinUI/Picea.Abies.WinUI.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Verify the package version and target frameworks
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PKG=$(ls ./nupkg/Picea.Abies.WinUI.*.nupkg | head -1)
          echo "Inspecting $PKG"
          unzip -l "$PKG" | tee /tmp/pkg-listing.txt

          # A package missing the Windows head would still install and then fail
          # to resolve for Windows consumers, so fail loudly here instead.
          grep -q "lib/net10.0-windows10.0.26100" /tmp/pkg-listing.txt \
            || { echo "❌ Package is missing the Windows App SDK head"; exit 1; }
          echo "✅ Windows App SDK head present"

          # This job packs on a different runner from the rest of the release, so
          # its version has to be checked rather than assumed — a mismatch here
          # publishes one package at a different version from all the others.
          case "$(basename "$PKG")" in
            "Picea.Abies.WinUI.${EXPECTED_VERSION}.nupkg")
              echo "✅ Package version matches the release ($EXPECTED_VERSION)" ;;
            *)
              echo "❌ Expected Picea.Abies.WinUI.${EXPECTED_VERSION}.nupkg, got $(basename "$PKG")"
              exit 1 ;;
          esac

      - name: Upload WinUI package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-winui
          path: ./nupkg/*.nupkg
          if-no-files-found: error

  release:
    name: Build, Pack and Publish
    runs-on: ubuntu-latest
    needs: [pack-winui]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WASM workloads
        run: dotnet workload install wasm-experimental wasm-tools

      - name: Install GitVersioning
        run: dotnet tool install --global nbgv

      - name: Set version
        id: version
        run: |
          # For tag runs, package version must match the tag (v2.0.4 -> 2.0.4).
          # For workflow_dispatch on non-tag refs, fall back to a stable computed version.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            nbgv set-version "$VERSION"
            echo "PublicRelease=true" >> "$GITHUB_ENV"
          else
            VERSION=$(nbgv get-version -v SimpleVersion)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test Picea.Abies.Tests
        run: dotnet test --project Picea.Abies.Tests/Picea.Abies.Tests.csproj --no-build --verbosity normal

      - name: Test Picea.Abies.Server.Tests
        run: dotnet test --project Picea.Abies.Server.Tests/Picea.Abies.Server.Tests.csproj --no-build --verbosity normal

      - name: Test Picea.Abies.Server.Kestrel.Tests
        run: dotnet test --project Picea.Abies.Server.Kestrel.Tests/Picea.Abies.Server.Kestrel.Tests.csproj --no-build --verbosity normal

      - name: Test Picea.Abies.Conduit.Tests
        run: dotnet test --project Picea.Abies.Conduit.Tests/Picea.Abies.Conduit.Tests.csproj --no-build --verbosity normal

      - name: Test Picea.Abies.Conduit.Wasm.Tests
        run: dotnet test --project Picea.Abies.Conduit.Wasm.Tests/Picea.Abies.Conduit.Wasm.Tests.csproj --no-build --verbosity normal

      - name: Test Picea.Abies.Conduit.Api.Tests
        run: dotnet test --project Picea.Abies.Conduit.Api.Tests/Picea.Abies.Conduit.Api.Tests.csproj --no-build --verbosity normal

      - name: Test Picea.Abies.Analyzers.Tests
        run: dotnet test --project Picea.Abies.Analyzers.Tests/Picea.Abies.Analyzers.Tests.csproj --no-build --verbosity normal

      - name: Test Picea.Abies.Templates.Testing (build-smoke only)
        run: dotnet test --project Picea.Abies.Templates.Testing/Picea.Abies.Templates.Testing.csproj --no-build --verbosity normal -- --treenode-filter "/*/*/*/*[Category!=E2E]"

      - name: Pack Picea.Abies
        run: dotnet pack ./Picea.Abies/Picea.Abies.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Picea.Abies.Browser
        run: dotnet pack ./Picea.Abies.Browser/Picea.Abies.Browser.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Picea.Abies.Server
        run: dotnet pack ./Picea.Abies.Server/Picea.Abies.Server.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Picea.Abies.Server.Kestrel
        run: dotnet pack ./Picea.Abies.Server.Kestrel/Picea.Abies.Server.Kestrel.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Picea.Abies.Native
        run: dotnet pack ./Picea.Abies.Native/Picea.Abies.Native.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Picea.Abies.Testing
        run: dotnet pack ./Picea.Abies.Testing/Picea.Abies.Testing.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Picea.Abies.Testing.Visual
        run: dotnet pack ./Picea.Abies.Testing.Visual/Picea.Abies.Testing.Visual.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Picea.Abies.UI
        run: dotnet pack ./Picea.Abies.UI/Picea.Abies.UI.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      # Packed as a dotnet global tool (`abies`), not a library.
      - name: Pack Picea.Abies.Cli
        run: dotnet pack ./Picea.Abies.Cli/Picea.Abies.Cli.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Picea.Abies.Templates
        run: dotnet pack ./Picea.Abies.Templates/Picea.Abies.Templates.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Abies (redirect metapackage)
        run: dotnet pack ./Metapackages/Abies/Abies.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Abies.Browser (redirect metapackage)
        run: dotnet pack ./Metapackages/Abies.Browser/Abies.Browser.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Abies.Server (redirect metapackage)
        run: dotnet pack ./Metapackages/Abies.Server/Abies.Server.csproj --configuration Release --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Download the Windows-built WinUI package
        uses: actions/download-artifact@v4
        with:
          name: nupkg-winui
          path: ./nupkg

      - name: List packages to publish
        run: ls -l ./nupkg

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
